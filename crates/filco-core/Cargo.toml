[package]
name = "filco-core"
description = "Slot, page, layer and keyboard model data for FILCO keyboards that use the FILCO Assist protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3"
jsonschema = { version = "0.60.2", default-features = false }
