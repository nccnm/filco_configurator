[package]
name = "filco-sim"
description = "Simulated FILCO keyboard speaking the FILCO Assist protocol, with fault injection, for tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
filco-core = { path = "../filco-core" }
filco-protocol = { path = "../filco-protocol" }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
