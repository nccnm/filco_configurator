[package]
name = "filco-updater"
description = "Make a copy of the stock Diatec / Sonix ISP updater that flashes a different HEX: rewrite the ZIP in resource RT_RCDATA 4011 and read it back"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints.rust]
# Resource reading and writing go through Win32 (LoadLibraryExW as data file, UpdateResourceW); every unsafe
# block states why it is sound. The ZIP code is safe Rust.
unsafe_code = "allow"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
thiserror = "2.0.21"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = ["Win32_Foundation", "Win32_System_LibraryLoader"]
