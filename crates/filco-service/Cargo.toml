[package]
name = "filco-service"
description = "Editing sessions, safe writes, backups, journal and device discovery for the FILCO layer editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
filco-core = { path = "../filco-core" }
filco-fwinfo = { path = "../filco-fwinfo" }
filco-protocol = { path = "../filco-protocol" }
filco-sim = { path = "../filco-sim" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
jiff = "0.2.38"
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.12.0"
criterion = { version = "0.8.2", default-features = false }
tempfile = "3"

[[bench]]
name = "read"
harness = false
