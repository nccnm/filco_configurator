[package]
name = "filco-service"
description = "Editing sessions, safe writes, backups, journal and device discovery for the FILCO layer editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
filco-core = { path = "../filco-core" }
filco-protocol = { path = "../filco-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"

[dev-dependencies]
filco-sim = { path = "../filco-sim" }
tempfile = "3"
