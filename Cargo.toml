[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
# Protocol and product names (GetFeature, FILCO Assist) read better without backticks.
doc_markdown = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# The emulator runs some hundred million instructions per firmware test; unoptimised it would take minutes.
[profile.dev.package.m0emu]
opt-level = 3

[profile.dev.package.thumb]
opt-level = 3

[profile.dev.package.filco-fwtest]
opt-level = 3
