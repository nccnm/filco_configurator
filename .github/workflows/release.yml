# Pushing a tag such as v0.2.0 checks the code, builds the installer and publishes it on GitHub Releases.
# The tag must match "version" in src-tauri/tauri.conf.json.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag matches the app version
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match version $version"
          }
      - uses: ./.github/actions/setup
      - name: Format, lint, type checks and tests
        run: pwsh scripts/check.ps1
      - name: Build the installer, then install and uninstall it
        run: pwsh scripts/release.ps1 -InstallTest
      # GitHub replaces the spaces of an asset name with dots: name the files that way, so the .sha256 matches.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis -Filter '*_x64-setup.exe' | Select-Object -First 1
          $name = $setup.Name -replace ' ', '.'
          New-Item -ItemType Directory dist | Out-Null
          $exe = "dist/$name"
          Copy-Item $setup.FullName $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content -NoNewline -Encoding utf8NoBOM "$exe.sha256"
          $notes = (Get-Content .github/release-notes.md -Raw).Replace('{{NAME}}', $name)
          Set-Content -Encoding utf8NoBOM dist-notes.md $notes
          # Pre-release while the keyboard model is marked experimental.
          gh release create $env:GITHUB_REF_NAME $exe "$exe.sha256" `
            --title "filco keyboard keymap $($env:GITHUB_REF_NAME.TrimStart('v'))" `
            --notes-file dist-notes.md --prerelease
          if ($LASTEXITCODE -ne 0) { exit 1 }
