name: Set up the build tools
description: Rust (version from rust-toolchain.toml), cargo-deny, Node.js and the npm packages
runs:
  using: composite
  steps:
    - name: Install the pinned Rust toolchain
      shell: pwsh
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
    - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
      with:
        tool: cargo-deny
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm
    - name: Install npm packages
      shell: pwsh
      run: npm ci
