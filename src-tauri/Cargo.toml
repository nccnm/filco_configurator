[package]
name = "keyboard-layer-editor"
description = "Unofficial layer editor for FILCO keyboards that use FILCO Assist"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Runs against a simulated keyboard instead of the HID stack: for E2E tests and screenshots.
e2e-sim = []

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
filco-core = { path = "../crates/filco-core" }
filco-fwinfo = { path = "../crates/filco-fwinfo" }
filco-protocol = { path = "../crates/filco-protocol" }
filco-service = { path = "../crates/filco-service" }
filco-sim = { path = "../crates/filco-sim" }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
ts-rs = "12.0.1"

[target.'cfg(windows)'.dependencies]
filco-hid-windows = { path = "../crates/filco-hid-windows" }

[dev-dependencies]
tempfile = "3"
